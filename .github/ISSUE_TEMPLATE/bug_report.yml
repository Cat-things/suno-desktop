name: 🐛 Bug report
description: Something in Suno Desktop isn't working right.
title: '[Bug]: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! A few details make bugs much faster to fix.

        If the same thing happens on suno.com in your normal browser, it's a Suno issue: please report it at [help.suno.com](https://help.suno.com) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw. Screenshots or a short video help a lot.
      placeholder: When I press the play/pause media key, nothing happens…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Suno Desktop
        2. Play a song from the library
        3. Press the play/pause key on the keyboard
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      multiple: true
      options:
        - Signing in
        - Playback, media keys or the Windows media overlay
        - Tray icon or closing to tray
        - Window, title bar or theme
        - Downloads
        - Discord Rich Presence
        - Updates
        - Settings
        - Deep links (suno-desktop://)
        - Installer or portable exe
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings → About.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you get the app?
      options:
        - Installer (Suno-Desktop-Setup)
        - Portable exe
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: PC type
      description: Most PCs are x64. ARM64 includes Snapdragon laptops like Copilot+ PCs.
      options:
        - x64 (Intel or AMD)
        - ARM64
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the end of `%APPDATA%\Suno Desktop\logs\main.log` (type that path into File Explorer's address bar).
        Check it first and remove anything personal. Never paste passwords or cookies.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched [existing issues](https://github.com/Cat-things/suno-desktop/issues?q=is%3Aissue) and this hasn't been reported yet.
          required: true
        - label: This is about Suno Desktop, not suno.com itself or my Suno account.
          required: true
        - label: This is not a security vulnerability. Those go through [private reporting](https://github.com/Cat-things/suno-desktop/security/advisories/new).
          required: true
