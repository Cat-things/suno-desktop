labels: ['area: themes']
body:
  - type: markdown
    attributes:
      value: |
        Ideas for **Suno++ themes**: new looks for suno.com, in the desktop app and in the browser. Themes will be made and shared by the community through Suno++.

        Themes change how Suno _looks_. If your idea changes how Suno _works_, it's a [plugin idea](https://github.com/Cat-things/suno-desktop/discussions/categories/plugin-ideas).
  - type: textarea
    id: idea
    attributes:
      label: What should the theme look like?
      description: Colors, fonts, spacing, vibe. Mockups and screenshots help a lot.
      placeholder: A high-contrast neon theme with a compact library list.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which parts of Suno should it restyle?
      multiple: true
      options:
        - Everything
        - Create page
        - Library
        - Player
        - Song pages
        - Somewhere else
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Light, dark or both?
      options:
        - Dark
        - Light
        - Both
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: Inspiration, existing themes you like, accessibility needs.
