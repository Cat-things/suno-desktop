name: Labels

# Creates and updates the repository's issue labels from .github/labels.json.
# Labels that exist on GitHub but not in the file are left alone.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -c '.[]' .github/labels.json | while read -r label; do
            name="$(jq -r '.name' <<<"${label}")"
            gh label create "${name}" \
              --color "$(jq -r '.color' <<<"${label}")" \
              --description "$(jq -r '.description' <<<"${label}")" \
              --force
            echo "synced: ${name}"
          done
